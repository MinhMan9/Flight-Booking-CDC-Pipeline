services:
  # ==========================================
  # 1. SQL SERVER (Đã có từ trước)
  # ==========================================
  mssql:
    # service name
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:latest
    container_name: mssql
    hostname: sql-server
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_AGENT_ENABLED: "True"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    networks:
      - cdc_network

  # ==========================================
  # 2. APACHE KAFKA KRAFT
  # ==========================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'

      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      KAFKA_CLUSTER_ID: '${KAFKA_CLUSTER_ID}'

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - cdc_network
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  # ==========================================
  # 3. KAFKA UI
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: Apache-KRaft-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - cdc_network

  # ==========================================
  # 4. DEBEZIUM (KAFKA CONNECT)
  # ==========================================
  debezium:
    image: quay.io/debezium/connect:2.5
    container_name: debezium
    depends_on:
      - kafka
      - mssql
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=connect_configs
      - OFFSET_STORAGE_TOPIC=connect_offsets
      - STATUS_STORAGE_TOPIC=connect_statuses

      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - debezium_plugins:/kafka/connect
    networks:
      - cdc_network

  # ==========================================
  # 5. DATA LAKE (MINIO - S3 COMPATIBLE)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # Cổng API để Kafka Connect đẩy dữ liệu vào
      - "9001:9001" # Cổng Web UI để bạn vào xem dữ liệu
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - cdc_network

  # ==========================================
  # 6. SCHEMA REGISTRY
  # ==========================================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.12
    container_name: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - cdc_network
    depends_on:
      - kafka

# ==========================================
# KHAI BÁO MẠNG VÀ Ổ CỨNG ÁNH XẠ
# ==========================================
networks:
  cdc_network:
    driver: bridge

volumes:
  sqlserver_data:
    name: "sqlserver_data"
  kafka_data:
    name: "kafka_data"
  debezium_plugins:
    name: "debezium_plugins"
  minio_data:
    name: "minio_data"
