services:
  # ==========================================
  # 1. SQL SERVER
  # ==========================================
  mssql:
    # service name
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:latest
    container_name: mssql
    hostname: sql-server
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_AGENT_ENABLED: "True"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    networks:
      - cdc_network

  # ==========================================
  # 2. APACHE KAFKA KRAFT
  # ==========================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9405:9405"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'

      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      KAFKA_CLUSTER_ID: '${KAFKA_CLUSTER_ID}'

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      KAFKA_OPTS: '-javaagent:/kafka/jmx_prometheus_javaagent.jar=9405:/kafka/kafka-exporter-config.yml'
    networks:
      - cdc_network
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./monitoring/jmx_prometheus_javaagent-0.19.0.jar:/kafka/jmx_prometheus_javaagent.jar
      - ./monitoring/kafka-exporter-config.yml:/kafka/kafka-exporter-config.yml

  # ==========================================
  # 3. KAFKA UI
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: Apache-KRaft-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - cdc_network

  # ==========================================
  # 4. DEBEZIUM (KAFKA CONNECT)
  # ==========================================
  debezium:
    image: quay.io/debezium/connect:2.5
    container_name: debezium
    depends_on:
      - kafka
      - mssql
    ports:
      - "8083:8083"
      - "9404:9404"
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=connect_configs
      - OFFSET_STORAGE_TOPIC=connect_offsets
      - STATUS_STORAGE_TOPIC=connect_statuses

      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - KAFKA_OPTS=-javaagent:/kafka/jmx_prometheus_javaagent.jar=9404:/kafka/debezium-exporter-config.yml
    volumes:
      - debezium_plugins:/kafka/connect
      - ./monitoring/jmx_prometheus_javaagent-0.19.0.jar:/kafka/jmx_prometheus_javaagent.jar
      - ./monitoring/debezium-exporter-config.yml:/kafka/debezium-exporter-config.yml
    networks:
      - cdc_network

  # ==========================================
  # 5. DATA LAKE (MINIO - S3 COMPATIBLE)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API Port for Kafka Connect sink data
      - "9001:9001" # Web UI Port for viewing data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - cdc_network

  # ==========================================
  # 6. SCHEMA REGISTRY
  # ==========================================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.12
    container_name: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - cdc_network
    depends_on:
      - kafka
  # ==========================================
  # 7. ICEBERG REST CATALOG
  # ==========================================
  rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://datalake
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_S3_PATH_STYLE_ACCESS=true
    networks:
      - cdc_network
    depends_on:
      - minio

  # ==========================================
  # 8. SPARK ICEBERG
  # ==========================================
  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg
    depends_on:
      - rest
      - minio
    volumes:
      - ./spark/scripts:/home/iceberg/pyspark/scripts
      - ./spark/jars:/home/iceberg/pyspark/jars
      - ./reports:/home/iceberg/pyspark/reports
      - ./notebooks:/home/iceberg/notebooks
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - DB_SERVER=mssql,1433
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "8888:8888"
      - "8082:8080"
      - "10000:10000"
      - "10001:10001"
    networks:
      - cdc_network

  # ==========================================
  # 9. TRINO
  # ==========================================
  trino:
    image: 'trinodb/trino'
    hostname: trino
    container_name: trino
    volumes:
      - ./trino/etc/catalog:/etc/trino/catalog
    ports:
      - '9091:8080'
    networks:
      - cdc_network

  # ==========================================
  # 10. SUPERSET
  # ==========================================
  superset:
    build: ./superset
    container_name: superset
    environment:
      - SUPERSET_SECRET_KEY=mysecretkey
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_FIRST_NAME=Superset
      - ADMIN_LAST_NAME=Admin
      - ADMIN_EMAIL=admin@example.com
      - DATABASE_URL=postgresql+psycopg2://superset:superset@superset-db:5432/superset
    depends_on:
      - superset-db
    ports:
      - "8088:8088"
    volumes:
      - ./superset/superset_home:/app/superset_home
    networks:
      - cdc_network
    command: >
      /bin/sh -c " superset db upgrade && superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin || true && superset init && superset run -h 0.0.0.0 -p 8088 "
  # ==========================================
  # 11. SUPERSET DATABASE
  # ==========================================
  superset-db:
    image: postgres:15
    container_name: superset-db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - ./superset/superset_db_data:/var/lib/postgresql/data
    networks:
      - cdc_network

  # ==========================================
  # 12. PROMETHEUS
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cdc_network

  # ==========================================
  # 13. GRAFANA
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_EVIRONMENT_ADMIN_USER=admin
      - GF_EVIRONMENT_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/kafka-dashboard.json:/etc/grafana/dashboards/kafka-dashboard.json
      - ./monitoring/debezium-dashboard.json:/etc/grafana/dashboards/debezium-dashboard.json
    depends_on:
      - prometheus
    networks:
      - cdc_network

  # ==========================================
  # 14. Node-Exporter
  # ==========================================  
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - cdc_network

  # ==========================================
  # 15. Kafka Exporter (Consumer Lag & Offset)
  # ==========================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command: [ "--kafka.server=kafka:29092" ]
    ports:
      - "9308:9308"
    depends_on:
      - kafka
    networks:
      - cdc_network
  # ==========================================
  # NETWORKS AND VOLUMES MAPPING
  # ==========================================
networks:
  cdc_network:
    driver: bridge

volumes:
  sqlserver_data:
    name: "sqlserver_data"
  kafka_data:
    name: "kafka_data"
  debezium_plugins:
    name: "debezium_plugins"
  minio_data:
    name: "minio_data"
