global:
  scrape_interval: 15s 
  evaluation_interval: 15s

scrape_configs:
  # 1. Self monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Debezium
  - job_name: 'debezium'
    static_configs:
      - targets: ['debezium:9404']

  # 3. Kafka Broker (Consumer Lag, Throughput)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9405']

  # 4. MinIO
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # 5. cAdvisor (Docker RAM/CPU)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 6. Node-exporter
  - job_name: 'node-exporter'
    static_configs:
    - targets: ['node-exporter:9100']